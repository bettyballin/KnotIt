<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnotIt — Knitting Pattern Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>KnotIt</h1>
    <p class="tagline">Upload a pattern, then step through each knot left-to-right, top-to-bottom.</p>
  </header>

  <section class="controls top-controls">
    <label class="file-label">
      <input type="file" id="fileInput" accept="image/*">
      <span>Upload pattern</span>
    </label>
    <button id="lockBtn" disabled>Lock template</button>
    <label class="checkbox-label">
      <input type="checkbox" id="zoomToggle" checked>
      Zoom to row
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="showAllToggle">
      Show all detections
    </label>
  </section>

  <section class="template-section" id="templateSection" hidden>
    <details open>
      <summary>Template</summary>
      <div class="template-row">
        <div class="template-preview-wrap">
          <span class="template-label">Template</span>
          <canvas id="templateCanvas" class="template-preview"></canvas>
        </div>
        <div class="template-controls">
          <p class="hint" id="templateHint">Tap or click any single knot in the pattern below to set the template.</p>
          <div class="tuning-row">
            <label>
              Template size
              <input type="range" id="templateSize" min="14" max="120" value="40">
              <span id="templateSizeValue">40</span>
            </label>
            <label>
              Match threshold
              <input type="range" id="matchThreshold" min="20" max="90" value="50">
              <span id="matchThresholdValue">50</span>
            </label>
            <label>
              Rotations
              <input type="range" id="rotationCount" min="1" max="24" value="12">
              <span id="rotationCountValue">12</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="matchInverted" checked>
              Match opposite-brightness fills too
            </label>
            <button id="rematchBtn" disabled>Re-match</button>
          </div>
        </div>
      </div>
    </details>
  </section>

  <section class="recolor-section" id="recolorSection" hidden>
    <details>
      <summary>Recolour pattern (swap colours)</summary>
      <div id="recolorRules" class="recolor-rules"></div>
      <div class="recolor-actions">
        <button id="addRecolorBtn" type="button">+ Add colour swap</button>
        <button id="clearRecolorBtn" type="button">Reset to original</button>
      </div>
    </details>
  </section>

  <section class="status">
    <span id="status">Loading image processor…</span>
    <span id="counter"></span>
  </section>

  <section class="zoom-section" id="zoomSection" hidden>
    <div class="zoom-wrap">
      <canvas id="zoomCanvas"></canvas>
    </div>
    <div class="nav-row">
      <button id="prevBtn" disabled aria-label="Previous knot">&larr;</button>
      <button id="nextBtn" disabled>Next knot &rarr;</button>
      <button id="resetBtn" disabled aria-label="Reset to first knot">Reset</button>
      <label class="row-jump">
        Row
        <input type="number" id="rowInput" min="1" value="1" disabled>
        <span id="rowTotal">/ —</span>
      </label>
    </div>
  </section>

  <section class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </section>

  <footer>
    <p>Tip: press <kbd>Space</kbd> or <kbd>&rarr;</kbd> for next knot, <kbd>&larr;</kbd> for previous.</p>
  </footer>

  <script async src="https://docs.opencv.org/4.10.0/opencv.js" onload="window.__cvScriptLoaded=true"></script>
  <script src="app.js"></script>
</body>
</html>
